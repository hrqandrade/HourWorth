name: HourWorth
options:
  bundleIdPrefix: com.hrqandrade
  deploymentTarget:
    iOS: "18.0"
settings:
  base:
    SWIFT_VERSION: 6.0
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
targets:
  HourWorth:
    type: application
    platform: iOS
    sources: [HourWorthApp]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hrqandrade.HourWorth
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: HourWorth
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    scheme:
      testTargets: [HourWorthTests]
  HourWorthTests:
    type: bundle.unit-test
    platform: iOS
    sources: [HourWorthTests]
    dependencies:
      - target: HourWorth
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.hrqandrade.HourWorthTests
        GENERATE_INFOPLIST_FILE: YES

